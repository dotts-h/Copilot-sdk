name: CI

# Triggers run CI exactly once per change: `pull_request` validates a branch while a
# PR is open, and `push` validates `main` on merge. A feature branch is NOT listed
# under `push` — listing it there ran the whole pipeline TWICE per push (the push
# event AND the pull_request event, on different `github.ref`s the concurrency group
# can't dedup). — see docs/CONVENTIONS.md "Quality gates"
#
# `paths-ignore` skips the whole pipeline for docs-only and agent-config (`.claude/**`)
# changes (the build/test/fuzz suite can't be affected by a markdown edit or a Claude
# settings/skill edit) — `desktop.yml`/`pages.yml` already path-filter, and a docs-only
# PR has merged with those checks skipped, so the required-check set tolerates a skipped
# workflow here. The ignore globs are documentation + agent tooling only: no committed
# `.md` or `.claude/**` file is a build or test input (the instruction-import tests
# synthesize their `CLAUDE.md`/`AGENTS.md` fixtures in a temp dir), so nothing under test
# loses coverage. A PR that also touches code falls through the filter (paths-ignore skips
# only when EVERY changed path matches) and runs in full.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt (check formatting)
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --timeout=5m
      - name: Workflow invariants (no CI double-runs; release version resolution)
        run: bash scripts/check-workflows.sh

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Unit + integration tests
        run: go test ./... -race -count=1 -timeout 180s -coverprofile=coverage.txt -covermode=atomic
      - name: Enforce coverage floor
        run: |
          go tool cover -func=coverage.txt | tee coverage-func.txt
          total=$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 65) { print "::error::coverage " t "% is below the 65% floor"; exit 1 } }'
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.txt
            coverage-func.txt

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Short fuzz of the pricing engine
        run: go test ./internal/telemetry -run x -fuzz FuzzPriceNeverNegativeOrNaN -fuzztime 20s

  build:
    name: Build matrix
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Build my-orchestra
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="my-orchestra-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && out="$out.exe"
          go build -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o "dist/$out" ./cmd/my-orchestra
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: my-orchestra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
