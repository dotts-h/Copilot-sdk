name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      - name: gofmt (check formatting)
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout=5m

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      - name: Unit + integration tests
        run: go test ./... -race -count=1 -timeout 180s -coverprofile=coverage.txt -covermode=atomic
      - name: Enforce coverage floor
        run: |
          go tool cover -func=coverage.txt | tee coverage-func.txt
          total=$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 65) { print "::error::coverage " t "% is below the 65% floor"; exit 1 } }'
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.txt
            coverage-func.txt

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      - name: Short fuzz of the pricing engine
        run: go test ./internal/telemetry -run x -fuzz FuzzPriceNeverNegativeOrNaN -fuzztime 20s

  build:
    name: Build matrix
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      - name: Build my-orchestra
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="my-orchestra-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && out="$out.exe"
          go build -ldflags "-s -w -X main.version=ci-${{ github.sha }}" -o "dist/$out" ./cmd/my-orchestra
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: my-orchestra-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
